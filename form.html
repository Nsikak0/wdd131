<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Share your experience with a product by submitting a product review.">
    <meta name="author" content="Nsikak Asuquo">
    <title>Product Review | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header class="page-header">
        <p>WDD 131 <span aria-hidden="true">/</span> Product feedback</p>
    </header>
    <main>
        <section class="form-card" aria-labelledby="page-title">
            <div class="intro">
                <p class="eyebrow">Your experience matters</p>
                <h1 id="page-title">Product Review</h1>
                <p>Tell us what you think. Your feedback helps others choose with confidence.</p>
            </div>
            <form method="get" action="review.html">
                <div class="form-field">
                    <label for="product-name">Product Name <span class="required-note">(required)</span></label>
                    <select id="product-name" name="product-name" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="form-field rating-field">
                    <legend>Overall Rating <span class="required-note">(required)</span></legend>
                    <div class="rating-options">
                        <label class="rating-option" for="rating-1">
                            <input id="rating-1" name="rating" type="radio" value="1" required>
                            <span aria-hidden="true">&star;</span><span class="visually-hidden">1 star</span>
                        </label>
                        <label class="rating-option" for="rating-2">
                            <input id="rating-2" name="rating" type="radio" value="2" required>
                            <span aria-hidden="true">&star;&star;</span><span class="visually-hidden">2 stars</span>
                        </label>
                        <label class="rating-option" for="rating-3">
                            <input id="rating-3" name="rating" type="radio" value="3" required>
                            <span aria-hidden="true">&star;&star;&star;</span><span class="visually-hidden">3 stars</span>
                        </label>
                        <label class="rating-option" for="rating-4">
                            <input id="rating-4" name="rating" type="radio" value="4" required>
                            <span aria-hidden="true">&star;&star;&star;&star;</span><span class="visually-hidden">4 stars</span>
                        </label>
                        <label class="rating-option" for="rating-5">
                            <input id="rating-5" name="rating" type="radio" value="5" required>
                            <span aria-hidden="true">&star;&star;&star;&star;&star;</span><span class="visually-hidden">5 stars</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label for="installation-date">Date of Installation <span class="required-note">(required)</span></label>
                    <input id="installation-date" name="installation-date" type="date" required>
                </div>

                <fieldset class="form-field feature-field">
                    <legend>Useful Features <span class="field-hint">Check all that apply</span></legend>
                    <label class="check-option" for="feature-durability">
                        <input id="feature-durability" name="useful-features" type="checkbox" value="durability">
                        Durability
                    </label>
                    <label class="check-option" for="feature-ease-of-use">
                        <input id="feature-ease-of-use" name="useful-features" type="checkbox" value="ease-of-use">
                        Ease of use
                    </label>
                    <label class="check-option" for="feature-performance">
                        <input id="feature-performance" name="useful-features" type="checkbox" value="performance">
                        Performance
                    </label>
                    <label class="check-option" for="feature-design">
                        <input id="feature-design" name="useful-features" type="checkbox" value="design">
                        Design
                    </label>
                </fieldset>

                <div class="form-field">
                    <label for="written-review">Written Review <span class="field-hint">Optional</span></label>
                    <textarea id="written-review" name="written-review" rows="5"></textarea>
                </div>

                <div class="form-field">
                    <label for="user-name">Your Name <span class="field-hint">Optional</span></label>
                    <input id="user-name" name="user-name" type="text" autocomplete="name">
                </div>

                <input class="submit-button" type="submit" value="Submit Review">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Nsikak Asuquo | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
